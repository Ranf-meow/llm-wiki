    <meta charset="UTF-8">

    <style>
        :root {
            --bg-color: #0f1020;
            --card-bg: rgba(255, 255, 255, 0.07);
            --text-color: #f0f0f0;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', sans-serif; }
        body { background: var(--bg-color); color: var(--text-color); min-height: 100vh; padding: 20px; }
        header { text-align: center; margin-bottom: 30px; }
        header h1 { font-size: 2.2rem; color: #ff79c6; margin-bottom: 10px; }
        header p { color: #8be9fd; font-size: 1.1rem; }
        
        .container { max-width: 1200px; margin: 0 auto; display: grid; grid-template-columns: 320px 1fr; gap: 30px; }
        @media (max-width: 900px) { .container { grid-template-columns: 1fr; } }
        
        /* 左側導覽選單區 */
        .sidebar { background: var(--card-bg); padding: 20px; border-radius: 16px; backdrop-filter: blur(10px); border: 1px solid rgba(255,255,255,0.1); }
        .sidebar h3 { font-size: 1.1rem; margin-bottom: 15px; color: #ff79c6; border-left: 4px solid #ff79c6; padding-left: 8px; }

        .band-list { display: flex; flex-direction: column; gap: 8px; max-height: 600px; overflow-y: auto; padding-right: 5px; }
        .band-btn { background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); color: #fff; padding: 12px 15px; text-align: left; border-radius: 8px; cursor: pointer; transition: 0.2s; font-size: 0.95rem; }
        .band-btn:hover, .band-btn.active { background: #bd93f9; color: #1e1f29; font-weight: bold; }

        /* 右側詳細資訊區 */
        .content-panel { background: var(--card-bg); padding: 30px; border-radius: 16px; backdrop-filter: blur(10px); border: 1px solid rgba(255,255,255,0.1); }
        .band-info h2 { font-size: 2rem; color: #50fa7b; margin-bottom: 10px; }
        .band-info p { color: #f8f8f2; line-height: 1.6; margin-bottom: 20px; }
        
        .section-title { font-size: 1.2rem; color: #8be9fd; margin: 20px 0 10px; border-left: 4px solid #8be9fd; padding-left: 8px; }
        .songs-list { list-style: inside; color: #ffb86c; margin-bottom: 20px; }
        .songs-list li { margin-bottom: 5px; }

        .members-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 15px; }
        .member-card { background: rgba(0,0,0,0.2); border-radius: 10px; padding: 10px; text-align: center; border: 1px solid rgba(255,255,255,0.05); }
        
        /* 使用 contain 確保全身立繪完整不被切掉 */
        .member-card img { 
            width: 100%; 
            height: 160px; 
            object-fit: contain; 
            border-radius: 8px; 
            margin-bottom: 8px; 
            background: rgba(0, 0, 0, 0.4); 
            padding: 4px;
        }
        
        .member-card h4 { font-size: 0.95rem; color: #f8f8f2; margin-bottom: 4px; }
        .member-card span { font-size: 0.8rem; color: #ff79c6; display: block; }
    </style>
</head>

        const bandKeys = Object.keys(bandsData);
        const bandListContainer = document.getElementById('bandListContainer');
        const contentPanel = document.getElementById('contentPanel');

        function initList() {
            bandListContainer.innerHTML = '';
            bandKeys.forEach((key) => {
                const btn = document.createElement('button');
                btn.className = 'band-btn';
                btn.innerText = key;
                btn.onclick = () => selectBand(key);
                bandListContainer.appendChild(btn);
            });
        }

        function selectBand(bandName) {
            document.querySelectorAll('.band-btn').forEach(btn => {
                if(btn.innerText === bandName) btn.classList.add('active');
                else btn.classList.remove('active');
            });

            const data = bandsData[bandName];
            if(!data) return;

            let membersHtml = data.members.map(m => `
                <div class="member-card">
                    <img src="${m.img || 'https://via.placeholder.com/150/282a36/8be9fd?text=Bandori'}" alt="${m.name}" onerror="this.src='https://via.placeholder.com/150/282a36/8be9fd?text=Bandori'">
                    <h4>${m.name}</h4>
                    <span>${m.role}</span>
                    <small style="color: #6272a4;">CV: ${m.cv}</small>
                </div>
            `).join('');

            let songsHtml = data.songs.map(s => `<li>${s}</li>`).join('');

            contentPanel.innerHTML = `
                <div class="band-info">
                    <h2>${data.name}</h2>
                    <p>${data.desc}</p>
                    
                    <div class="section-title">🔥 熱門代表歌曲</div>
                    <ul class="songs-list">${songsHtml}</ul>
                    
                    <div class="section-title">👥 成員與角色陣容</div>
                    <div class="members-grid">${membersHtml}</div>
                </div>
            `;
        }

        initList();
    </script>
</body>
